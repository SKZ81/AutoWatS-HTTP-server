worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    server {
        listen 127.0.0.1:1486;
        server_name localhost;

        root /var/www/;

        # Internal Endpoint for authentication
        location = /_auth {
            internal;

            include fastcgi_params;

            fastcgi_param SCRIPT_FILENAME $document_root/cgi-bin/auth.py;
            fastcgi_param HTTP_COOKIE $http_cookie;
            fastcgi_pass unix:/run/fcgiwrap.sock;
        }

        # Login page
        location = /login.html {
            try_files /html/login.html =404;
        }

        # Sample authentication "protected" page
        location = /target.html {
            auth_request /_auth;

            try_files /html/target.html =404;
            error_page 401 =302 /html/login.html;
        }


        location = /login {
            rewrite ^/login$ /cgi-bin/login.py last;
        }

        location = /logout {
            rewrite ^/logout$ /cgi-bin/logout.py last;
        }

        location = /timestamps {
            rewrite ^/timestamps$ /cgi-bin/timestamps.py last;
        }

        location = /varieties {
            rewrite ^/varieties$ /cgi-bin/get_varieties.py last;
        }

        location = /plant/get {
            rewrite ^/plant/get$ /cgi-bin/search_plant_id.py last;
        }

        location = /plant/update {
            rewrite ^/plant/update$ /cgi-bin/update_plant.py last;
        }

        location = /plant/create_id {
            rewrite ^/plant/create_id$ /cgi-bin/create_tag.py last;
        }

        location = /plant/discard_id {
            rewrite ^/plant/discard_id$ /cgi-bin/discard_uuid.py last;
        }

        location = /debug/get_uuids {
            rewrite ^/debug/get_uuids$ /cgi-bin/debug_list_uuids.py last;
        }

        location ~ ^/cgi-bin/(login|logout|timestamps|get_varieties|search_plant_id|discard_uuid|debug_list_uuids)\.py$ {
            internal;
            include fastcgi_params;

            # Allow HTTP cookies when activated, otherwise restrict to HTTPS (1 = activated, 0 = deactived [default])
            fastcgi_param HTTP_COOKIES 1;

            fastcgi_pass unix:/var/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location ~ ^/cgi-bin/(update_plant|create_tag|discard_uuid)\.py$ {
            internal;

            auth_request /_auth;

            include fastcgi_params;
            fastcgi_pass unix:/var/run/fcgiwrap.socket;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        location /images/ {
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
